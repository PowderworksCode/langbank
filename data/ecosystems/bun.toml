id = "bun"
registry = "npm"
display-name = "Bun"
roles = ["package-manager", "runtime"]
implied-languages = ["javascript"]
manifest = "package.json"
lockfiles = ["bun.lock", "bun.lockb"]
gitignore-patterns = ["node_modules/"]
manifest-selection = "lockfile"

[dependency-pins]
syntax = "exact-semver"
advisory = false
