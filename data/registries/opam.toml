id = "opam"
display-name = "Opam package"
default-repository = "https://opam.ocaml.org"
uses-repository = true
homepage = "https://opam.ocaml.org"
repository = "https://github.com/ocaml/opam"

[namespace]
requirement = "prohibited"
case-sensitive = true

[name]
requirement = "required"
case-sensitive = true

[version]
requirement = "optional"
case-sensitive = true
