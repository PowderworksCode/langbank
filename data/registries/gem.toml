id = "gem"
display-name = "RubyGems"
default-repository = "https://rubygems.org"
uses-repository = true
homepage = "https://rubygems.org"
repository = "https://github.com/rubygems/rubygems.org"

[namespace]
requirement = "prohibited"
case-sensitive = true

[name]
requirement = "required"
case-sensitive = true

[version]
requirement = "optional"
case-sensitive = true
