id = "cocoapods"
display-name = "CocoaPods"
default-repository = "https://cdn.cocoapods.org/"
uses-repository = true
homepage = "https://cocoapods.org"
repository = "https://github.com/CocoaPods/CocoaPods"

[namespace]
requirement = "prohibited"
case-sensitive = true

[name]
requirement = "required"
case-sensitive = true

[version]
requirement = "optional"
case-sensitive = true
