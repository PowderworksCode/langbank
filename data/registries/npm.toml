id = "npm"
display-name = "Node NPM packages"
default-repository = "https://registry.npmjs.org/"
uses-repository = true
homepage = "https://www.npmjs.com"

[namespace]
requirement = "optional"
case-sensitive = true

[name]
requirement = "required"
case-sensitive = true

[version]
requirement = "optional"
case-sensitive = true
