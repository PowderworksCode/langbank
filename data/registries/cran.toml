id = "cran"
display-name = "CRAN"
default-repository = "https://cran.r-project.org"
uses-repository = true
homepage = "https://cran.r-project.org"

[namespace]
requirement = "prohibited"
case-sensitive = true

[name]
requirement = "required"
case-sensitive = true

[version]
requirement = "optional"
case-sensitive = true
