id = "javascript"
display-name = "JavaScript"
role = "programming"
extensions = ["js", "jsx", "mjs", "cjs"]
shebangs = ["node", "bun", "deno"]
facets = ["structured-code", "style-host", "component-host"]
comments = "javascript"
config-files = ["jsconfig.json"]

[conventions.typecheck]
config-files = ["jsconfig.json", "tsconfig.json"]

[conventions.test-layout]
source-roots = ["src"]
test-root = "tests"
test-suffixes = ["", ".test", ".spec"]

[[conventions.inline-test]]
starts-with = ["describe(", "describe."]
indicator = "describe"

[[conventions.inline-test]]
starts-with = ["it(", "it."]
indicator = "it"

[[conventions.inline-test]]
starts-with = ["test(", "test."]
indicator = "test"

[[conventions.inline-test]]
starts-with = ["import "]
contains-any = ["from \"vitest\"", "from 'vitest'", "@jest/globals", "node:test"]
indicator = "test framework import"
