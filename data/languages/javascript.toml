id = "javascript"
display-name = "JavaScript"
role = "programming"
filenames = ["Jakefile"]
extensions = ["_js", "bones", "cjs", "es", "es6", "frag", "gs", "jake", "javascript", "js", "jsb", "jscad", "jsfl", "jslib", "jsm", "jspre", "jss", "jsx", "mjs", "njs", "pac", "sjs", "ssjs", "xsjs", "xsjslib"]
primary-extensions = ["es", "frag", "gs"]
shebangs = ["bun", "chakra", "d8", "deno", "gjs", "js", "node", "nodejs", "qjs", "rhino", "v8", "v8-shell"]
facets = ["structured-code", "style-host", "component-host"]
comments = "javascript"
config-files = ["jsconfig.json"]

[conventions.typecheck]
config-files = ["jsconfig.json", "tsconfig.json"]

[conventions.test-layout]
source-roots = ["src"]
test-root = "tests"
test-suffixes = ["", ".test", ".spec"]

[[conventions.inline-test]]
starts-with = ["describe(", "describe."]
indicator = "describe"

[[conventions.inline-test]]
starts-with = ["it(", "it."]
indicator = "it"

[[conventions.inline-test]]
starts-with = ["test(", "test."]
indicator = "test"

[[conventions.inline-test]]
starts-with = ["import "]
contains-any = ["from \"vitest\"", "from 'vitest'", "@jest/globals", "node:test"]
indicator = "test framework import"
