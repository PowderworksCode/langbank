# Comment syntax, shared between languages that spell comments the same way.
# A language names one of these in its `comments` field.

[c]
line = ["//"]
block = [["/*", "*/"]]
documentation = ["///", "//!", "/**", "/*!"]
quotes = ["\"", "'"]
multi-quotes = []

[css]
line = []
block = [["/*", "*/"]]
documentation = []
quotes = ["\"", "'"]
multi-quotes = []

[dockerfile]
line = ["#"]
block = []
documentation = []
quotes = ["\"", "'"]
multi-quotes = []

[html]
line = []
block = [["<!--", "-->"]]
documentation = []
quotes = []
multi-quotes = []

[javascript]
line = ["//"]
block = [["/*", "*/"]]
documentation = ["/**"]
quotes = ["\"", "'"]
multi-quotes = ["`"]

[less]
line = ["//"]
block = [["/*", "*/"]]
documentation = []
quotes = ["\"", "'"]
multi-quotes = []

[php]
line = ["//", "#"]
block = [["/*", "*/"]]
documentation = ["/**"]
quotes = ["\"", "'"]
multi-quotes = []

[python]
line = ["#"]
block = []
documentation = []
quotes = ["\"", "'"]
multi-quotes = ["\"\"\"", "'''"]

[rust]
line = ["//"]
block = [["/*", "*/"]]
documentation = ["///", "//!", "/**", "/*!"]
quotes = ["\""]
multi-quotes = []

[sql]
line = ["--"]
block = [["/*", "*/"]]
documentation = []
quotes = ["\"", "'"]
multi-quotes = []

[svelte]
line = ["//"]
block = [["/*", "*/"], ["<!--", "-->"]]
documentation = ["/**"]
quotes = ["\"", "'"]
multi-quotes = ["`"]
