id = "tsc"
display-name = "TypeScript compiler"
kind = "type-checker"
languages = ["typescript"]
programs = ["tsc"]
homepage = "https://www.typescriptlang.org/"
categories = ["compiler", "language-server"]

[version]
arguments = ["--version"]
stream = "stdout"
pattern = '^Version (\d+\.\d+\.\d+)'

[distribution]
registry = "npm"
package = "typescript"
