id = "tsc"
display-name = "TypeScript compiler"
kind = "type-checker"
languages = ["typescript"]
programs = ["tsc"]

[version]
arguments = ["--version"]
stream = "stdout"
pattern = '^Version (\d+\.\d+\.\d+)'
categories = ["compiler", "language-server"]

[distribution]
registry = "npm"
package = "typescript"
