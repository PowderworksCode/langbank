id = "dotnet"
display-name = ".NET SDK"
kind = "build-system"
languages = ["c-sharp", "f-sharp", "visual-basic-net"]
programs = ["dotnet"]
homepage = "https://dotnet.microsoft.com"
repository = "https://github.com/dotnet/sdk"

[version]
arguments = ["--version"]
stream = "stdout"
pattern = '^(\d+\.\d+\.\d+)'
