id = "rustc"
display-name = "rustc"
kind = "compiler"
languages = ["rust"]
programs = ["rustc"]
homepage = "https://www.rust-lang.org"
repository = "https://github.com/rust-lang/rust"

[version]
arguments = ["--version"]
stream = "stdout"
pattern = '^rustc (\d+\.\d+\.\d+)'

[diagnostics]
format = "json"
arguments = ["--error-format=json"]
stream = "stderr"
