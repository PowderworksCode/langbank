# straitjacket configuration for langbank.
#
# One rule needs scoping here, for the reason langbank's subject matter keeps
# giving: a generated table of 317 regexes is long because upstream publishes
# 317 rules. Everything else stays on.
#
# There is no `theme-files` any more. It named the server's stylesheet, and the
# documentation site takes its palette from the generator rather than declaring
# one here, so no file in this repository defines colours for the rule to
# excuse.

# `data/heuristics.toml` is generated from linguist by `langbank-sync` and is as
# long as linguist's ruleset is. Splitting it would mean either splitting the
# generator's output along a boundary linguist does not have, or hand-editing a
# file whose header says it is generated. Neither is an improvement.
#
# `site/content/langbank.json` is the whole dataset printed by
# `scripts/data-manifest.sh`, committed so CI can diff it against the binary;
# it is exactly as long as the registries are.
file-size-exclude = ["data/heuristics.toml", "site/content/langbank.json"]
