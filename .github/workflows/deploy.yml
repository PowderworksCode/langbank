# Deploy main to https://langbank.dev
#
# No test gate here on purpose — the Docker build compiles the workspace, so a
# main that does not build cannot deploy, and ci.yml already gates the PR.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in quick succession would otherwise race to release different
# images. Newer wins; the older is cancelled before it deploys.
concurrency:
  group: deploy-langbank
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # First deploy on a fresh org has no app yet. Creating it here keeps the
      # workflow self-contained rather than requiring a manual `fly launch`.
      - name: Ensure the app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        run: |
          if flyctl status --app langbank >/dev/null 2>&1; then
            echo "app exists"
          else
            # `orgs list --json` has been both an array and a name->slug map
            # across flyctl versions; accept either rather than pinning one.
            ORG="${{ vars.FLY_ORG }}"
            if [ -z "$ORG" ]; then
              ORG=$(flyctl orgs list --json |
                jq -r 'if type=="array" then .[0].Slug else to_entries[0].value end')
            fi
            echo "creating langbank in org $ORG"
            flyctl apps create langbank --org "$ORG"
          fi

      # The remote builder is fast (it keeps the cargo-chef layers warm) but
      # intermittently cannot reach Fly's own registry while pushing layers.
      # The fallback deliberately takes a different path — building on the
      # runner — so it is a fallback rather than the same roll of the dice.
      - name: Deploy
        id: deploy
        continue-on-error: true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        run: flyctl deploy --config fly.toml --dockerfile Dockerfile --remote-only

      - name: Deploy (local build fallback)
        if: steps.deploy.outcome == 'failure'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        run: flyctl deploy --config fly.toml --dockerfile Dockerfile --local-only

      # The app's own address is the authority on whether the deploy worked.
      # The custom domain is a separate matter: until DNS points at Fly and a
      # certificate is issued, langbank.dev cannot answer, and that is not a
      # broken deploy — see docs/deploy.md.
      #
      # Every curl here is bounded. Without --max-time, a hostname with no DNS
      # record blocks on TCP connect for 135 seconds, so a 30-iteration loop
      # written to take 150 seconds took 70 minutes and hit the job timeout
      # instead. Three deploys burned half an hour each that way, all of them
      # after the app was already live.
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://langbank.fly.dev/health -o /tmp/health; then
              cat /tmp/health; echo
              if jq -e '.ok == true and .languages > 0 and .toolchains > 0' /tmp/health >/dev/null; then
                echo "the app is up with a populated registry"
                healthy=1
                break
              fi
              echo "  up, but the registry looks empty"
            fi
            sleep 5
          done
          if [ "${healthy:-0}" != 1 ]; then
            echo "::error::the app did not come up healthy at langbank.fly.dev"
            exit 1
          fi

      # Reported, not gated. A domain that resolves and then serves the wrong
      # thing is a real failure; one that does not resolve yet is just work the
      # account owner has not done.
      - name: Custom domain
        run: |
          if ! getent hosts langbank.dev >/dev/null 2>&1; then
            echo "::notice::langbank.dev has no DNS record yet — see docs/fly-setup.sh steps 6-7"
            exit 0
          fi
          if curl -fsS --max-time 15 https://langbank.dev/health -o /tmp/custom; then
            jq -e '.ok == true' /tmp/custom >/dev/null \
              && echo "langbank.dev is serving the app" \
              || { echo "::error::langbank.dev answered but not with langbank"; exit 1; }
          else
            echo "::warning::langbank.dev resolves but did not answer — the certificate may still be issuing"
          fi
