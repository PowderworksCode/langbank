# A throwaway Fly app per pull request, so a change to the site can be looked at
# before it merges.
#
# Fly has no per-deploy preview URLs; a preview is a separate app,
# langbank-pr-<n>.fly.dev, created on open and destroyed on close. The site
# holds no state, so a preview is a complete copy of production with different
# data compiled into it — which is exactly what a data change needs reviewing.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets are not available to fork PRs, so the deploy would fail with a
    # confusing auth error. Skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fly's remote builder intermittently cannot reach its own registry while
      # pushing layers, and a plain re-run often succeeds. So the deploy gets a
      # second attempt that takes a different path — building on the runner —
      # rather than a red tick on a working branch. A genuine failure still
      # fails twice.
      - name: Deploy preview
        id: deploy
        continue-on-error: true
        # Pinned to an exact version, not @v1 — older tags silently ignore the
        # `config` / `deploy_options` inputs and autodetect the wrong builder.
        uses: superfly/fly-pr-review-apps@5d9f067254bebd0aaa77d908d6337b63f4d4f019 # 1.6.0
        env:
          # A preview-scoped token that can CREATE apps — not the production
          # deploy token, which is scoped to one app.
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        with:
          name: langbank-pr-${{ github.event.number }}
          config: fly.preview.toml
          region: ewr
          ha: false
          launch_options: --dockerfile Dockerfile
          deploy_options: --dockerfile Dockerfile

      - name: Deploy preview (retry)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: superfly/fly-pr-review-apps@5d9f067254bebd0aaa77d908d6337b63f4d4f019 # 1.6.0
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_PREVIEW_TOKEN }}
        with:
          name: langbank-pr-${{ github.event.number }}
          config: fly.preview.toml
          region: ewr
          ha: false
          # Builds on the runner and pushes straight to registry.fly.io, so the
          # image never traverses Fly's internal network — the leg that keeps
          # refusing the connection. Slower, but it does not depend on the
          # component that is failing.
          launch_options: --dockerfile Dockerfile --local-only
          deploy_options: --dockerfile Dockerfile --local-only

      - name: Fail if both attempts failed
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry.outcome == 'failure'
        run: |
          echo "::error::the preview deploy failed twice — not a flake"
          exit 1

      - name: Resolve the preview URL
        id: url
        run: |
          echo "url=${{ steps.deploy.outputs.url || steps.deploy_retry.outputs.url }}" >> "$GITHUB_OUTPUT"

      - name: Verify the preview serves the site
        if: github.event.action != 'closed'
        env:
          URL: ${{ steps.url.outputs.url }}
        run: |
          echo "checking $URL"
          # The machine may still be booting, or waking — previews idle-stop.
          for i in $(seq 1 12); do
            if curl -sf -m 10 "$URL/health" -o /tmp/health; then break; fi
            echo "  attempt $i: not up yet"; sleep 6
          done
          cat /tmp/health; echo
          jq -e '.ok == true and .languages > 0' /tmp/health >/dev/null \
            || { echo "::error::$URL/health did not report a populated registry"; exit 1; }
          # The pages that would break first if the data or the renderer moved.
          for path in / /languages /languages/rust /toolchains /identify; do
            curl -sf -m 15 "$URL$path" -o /dev/null \
              || { echo "::error::$URL$path did not render"; exit 1; }
            echo "  $path ok"
          done

      # The counts are the reason a preview is worth reading on a data change:
      # "827 languages" moving to "831" is the diff, stated.
      - name: Comment the preview URL
        if: github.event.action != 'closed'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
        with:
          retries: 3
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- langbank-fly-preview -->';
            let counts = '';
            try {
              const res = await fetch(`${url}/health`);
              const h = await res.json();
              counts = `\n| languages | ecosystems | toolchains | registries |\n`
                     + `|---|---|---|---|\n`
                     + `| ${h.languages} | ${h.ecosystems} | ${h.toolchains} | ${h.registries} |\n`;
            } catch (e) {
              counts = `\n_Could not read the registry counts: ${e.message}_\n`;
            }
            const body = [
              marker,
              '### langbank preview',
              '',
              `**${url}**`,
              counts,
              'What this branch compiles into the binary, served. Useful pages:',
              '',
              `- [languages](${url}/languages) · [ecosystems](${url}/ecosystems) · [toolchains](${url}/toolchains) · [registries](${url}/registries)`,
              `- [identify](${url}/identify) — runs the content rules against a pasted file`,
              `- [gaps](${url}/gaps) — what langbank was asked and declined to answer`,
              '',
              '_Updated on every push. Destroyed when this PR closes._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
