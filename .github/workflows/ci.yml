name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream moves without asking. A weekly run turns "linguist added a
    # language" into a red build rather than a slow drift nobody notices.
    - cron: "17 6 * * 1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show                      # honours rust-toolchain.toml
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  coverage:
    # Langbank owns its language data; upstream sources are what it is checked
    # against. This fails if any of them knows a language, extension, filename
    # or interpreter that langbank does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: linguist coverage
        run: tools/sync-linguist.py check
      - name: purl coverage
        run: tools/sync-purl.py check
      - name: tokei and scc coverage
        run: tools/sync-corpora.py check
