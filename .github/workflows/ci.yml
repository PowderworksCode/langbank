name: ci

# Gates pull requests on the repository alone: does it build, is it formatted,
# do the tests pass. Whether an upstream has moved ahead of us is a different
# question with a different answer, and lives in drift.yml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # What a pull request touched decides whether the compiler has to run. On a
  # push there is no base to compare against, so everything counts as changed
  # and main is gated on the whole file exactly as before.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request; everything runs"
            exit 0
          fi
          # Named as what cannot reach the compiler rather than what can, so a
          # new kind of file is treated as code until someone says otherwise.
          # data/ is on the code side deliberately: build.rs generates the
          # tables from it, so a TOML edit there is a source change. site/ is
          # on the prose side: the site job grades it here and docs.yml diffs
          # its manifest against the binary, neither of which needs the
          # workspace built.
          if git diff --name-only "$BASE"...HEAD \
              | grep -qvE '^(README|AGENTS)\.md$|^docs/|^site/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "only prose changed; the compiler is not run"
          fi

  # The checks that cost seconds and hold whatever the pull request touched.
  # Split out of `rust` so they keep running on a documentation-only change:
  # straitjacket reads prose as well as source, and gating it on a Rust diff
  # would let exactly the findings it exists to catch through unexamined.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # drift.yml runs only on main and on a schedule, so a workflow calling a
      # script deleted on a branch stays green through review and fails after
      # the merge. That is not hypothetical: porting sync-heuristics.py to Rust
      # left drift.yml calling it, and main went red on exit 127. Eight more of
      # these scripts will be deleted as they are ported.
      - name: Workflows only call scripts that exist
        run: |
          missing=0
          for script in $(grep -rhoE 'tools/[A-Za-z0-9_.-]+\.(py|rb)' .github/workflows/ | sort -u); do
            if [ ! -f "$script" ]; then
              echo "::error::a workflow calls $script, which does not exist"
              missing=1
            fi
          done
          [ "$missing" = 0 ] && echo "every tools/ script a workflow calls is present"
          exit "$missing"

      # The taste rules cargo does not have: emoji and colour literals in
      # source, files past a line budget, code past a nesting budget, stray
      # TODOs. Pinned rather than floating, because the action installs
      # `latest` by default and a withdrawn rule turns a checked-in config
      # into a hard error — which is how this step first went red.
      #
      # Which findings are excused, and why, is in straitjacket.toml.
      - name: Straitjacket
        uses: PowderworksCode/straitjacket@276b469410ef5fd6ca44fed171537b9a287c2fc6 # v0.2.0
        with:
          version: v0.1.1

      # langbank is the leaf: a consumer takes it without taking a network
      # stack, a regex engine or an archive reader. The sync tools fetch over
      # HTTP and the site runs axum — that is what the other workspace members
      # are for. Checked rather than assumed, because the easiest way to lose
      # this property is one convenient `cargo add` in the wrong directory.
      #
      # `--no-deps` reads the manifests and resolves nothing, so this belongs
      # with the cheap checks rather than behind a build.
      - name: The leaf stays a leaf
        run: |
          allowed='inventory serde serde_json toml'
          actual=$(cargo metadata --format-version 1 --no-deps |
            jq -r '.packages[] | select(.name == "langbank") | .dependencies[].name' | sort -u)
          for dep in $actual; do
            case " $allowed " in
              *" $dep "*) ;;
              *) echo "::error::langbank gained a runtime dependency: $dep"; exit 1 ;;
            esac
          done
          echo "langbank depends only on: $(echo $actual)"
          echo "(serde derives the data types, toml is build-only, serde_json is dev-only)"

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show                      # honours rust-toolchain.toml
      - run: cargo fmt --check
      # --workspace, because without it clippy and the tests see only the root
      # package. `langbank-detect` and `langbank-sync` merged with their tests
      # never once run in CI, which is how a workspace member quietly stops
      # being checked: nothing fails, it just goes unexamined.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The site is a Bun package with its own type layer, linter and tests, so it
  # is graded the way the workspace is rather than only at deploy time. Named
  # steps rather than a loop: ordnung reads a workflow's steps to know which
  # tasks a language actually runs, and a loop tells it nothing.
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run build
      - run: bun run test
