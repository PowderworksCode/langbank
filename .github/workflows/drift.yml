name: drift

# Langbank is checked against seven upstreams that move without asking. That
# belongs on a schedule and on main, not on every pull request: a package
# appearing in mason has nothing to do with the change under review, and a red
# build somebody cannot fix from inside their own branch is one everybody
# learns to ignore.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: linguist coverage
        run: tools/sync-linguist.py check
      - name: purl coverage
        run: cargo run -q -p langbank-sync -- purl check
      - name: tokei and scc coverage
        run: tools/sync-corpora.py check
      - name: nvim-lspconfig coverage
        run: tools/sync-lspconfig.py check
      - name: mason-registry coverage
        run: tools/sync-mason.py check
      - name: static-analysis coverage
        run: tools/sync-static-analysis.py check
      - name: language coverage report
        run: cargo run -q -p langbank-sync -- coverage
      - name: linguist heuristics
        run: tools/sync-heuristics.py check
      - name: contested extensions
        run: tools/resolve-contested.py check
      - name: dependabot ecosystems
        run: |
          # Dependabot states its facts in Ruby, so they are read with Ripper
          # rather than by regex. A shallow clone is enough; nothing is vendored.
          git clone --depth 1 https://github.com/dependabot/dependabot-core.git /tmp/dependabot-core
          ruby tools/extract-dependabot.rb /tmp/dependabot-core > /tmp/dependabot.json
          tools/sync-dependabot.py check /tmp/dependabot.json
      - name: version probes, against whatever this runner has
        run: cargo run -q -p langbank-sync -- toolchains --strict
