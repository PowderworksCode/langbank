# The leaf crate stays dependency-free; the tools that maintain its data are a
# separate member so nothing downstream inherits an HTTP client.
[workspace]
members = ["detect", "sync"]

[package]
name = "langbank"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/PowderworksCode/langbank"
homepage = "https://langbank.dev"
description = "Language, ecosystem and toolchain data: what a language is, how to recognise it, and what its tooling can be asked."

[dependencies]
registry-inventory = { package = "inventory", version = "0.3" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
toml = "1"

[dev-dependencies]
serde_json = "1"
# Reading the data back as TOML, to check the generator put keys where the
# build script looks for them. Dev-only: a consumer takes none of this.
toml = "1"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
