[package]
name = "langbank"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/PowderworksCode/langbank"
description = "Language, ecosystem and toolchain data: what a language is, how to recognise it, and what its tooling can be asked."

[dependencies]
registry-inventory = { package = "inventory", version = "0.3" }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
toml = "1"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
