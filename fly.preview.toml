# Fly config for PR preview apps — one throwaway app per pull request, deployed
# by .github/workflows/preview.yml. The `app` name here is a placeholder; the
# review-apps action overrides it with `--name langbank-pr-<n>`.
#
# Previews idle-stop: a stopped machine wakes on the next request, and since the
# site holds no state, waking is indistinguishable from never having stopped.
# That is the whole benefit of a stateless site — a preview costs nothing while
# nobody is looking at it.

app = "langbank-preview"
primary_region = "ewr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
